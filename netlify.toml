[build]
  publish = "dist"
  command = "npm run deploy:ready"
  functions = "netlify/functions"

# Declared here, not via the `schedule()` import from @netlify/functions, which
# is a legacy v1-era no-op shim ((cron, handler) => handler) — the package's
# main.cjs isn't actually included in the deployed function bundle, so every
# invocation crashed at module load with Runtime.ImportModuleError. Found
# 2026-10-19 via the new function logging: agent-runner fired every 2 minutes
# as scheduled but crashed before running a single line, with no audit trail
# because it never got that far. netlify.toml scheduling works for any
# function language/style and has no such runtime dependency.
[functions."agent-runner"]
  schedule = "*/2 * * * *"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/agent-intake"
  to = "/.netlify/functions/agent-intake"
  status = 200
  force = true

[[redirects]]
  from = "/api/agent-admin"
  to = "/.netlify/functions/agent-admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout-session"
  to = "/.netlify/functions/get-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "http://bucuriedigital.com/*"
  to = "https://bucuriedigital.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bucuriedigital.com/*"
  to = "https://bucuriedigital.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bucuriedigital.com/*"
  to = "https://bucuriedigital.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
